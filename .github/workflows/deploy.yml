name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.dinerate.xyz/api
        run: npm run build

  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/dinerate_deploy_key
          chmod 600 ~/.ssh/dinerate_deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/dinerate_deploy_key "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e

            echo "Updating frontend repository..."
            cd /opt/dinerate/frontend

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "Rebuilding frontend container..."
            cd /opt/dinerate
            docker compose up -d --build frontend

            echo "Waiting for frontend..."
            sleep 10

            echo "Checking frontend..."
            curl --fail http://127.0.0.1:3000 > /dev/null

            echo "Frontend deployment completed."
          EOF
